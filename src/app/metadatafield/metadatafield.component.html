<div class="tt-cell">
  <app-tree-toggler
    [node]="node()"
    [level]="level()"
    (toggle)="toggle.emit()"
  ></app-tree-toggler
  >{{ fieldName() }}
</div>
<div class="tt-cell">{{ fieldValue() }}</div>
<div class="tt-cell">{{ fieldSource() }}</div>
<div class="tt-cell text-end">
  <button
    type="button"
    class="btn btn-sm btn-outline-secondary"
    (click)="toggleAction()"
  >
    <i [class]="actionIcon()"></i>
  </button>
</div>
