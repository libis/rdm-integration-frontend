<div class="tt-cell" role="gridcell">
  <app-tree-toggler
    [node]="node()"
    [level]="level()"
    [name]="fieldName()"
    (toggle)="toggle.emit()"
  ></app-tree-toggler
  >{{ fieldName() }}
</div>
<div class="tt-cell" role="gridcell">{{ fieldValue() }}</div>
<div class="tt-cell" role="gridcell">{{ fieldSource() }}</div>
<div class="tt-cell text-end" role="gridcell">
  <button
    type="button"
    class="btn btn-sm btn-outline-secondary"
    [attr.aria-label]="actionLabel()"
    [title]="actionLabel()"
    (click)="toggleAction()"
  >
    <i [class]="actionIcon()"></i>
  </button>
</div>
