<div class="tt-cell" role="gridcell">
  <app-tree-toggler
    [node]="node()"
    [level]="level()"
    [name]="datafile().name"
    (toggle)="toggle.emit()"
  ></app-tree-toggler
  >{{ sourceFile() }}
</div>
<div class="tt-cell text-center" role="gridcell">
  <i
    role="img"
    [class]="comparisonIcon()"
    [style.color]="comparisonColor()"
    [title]="comparisonTitle()"
    [attr.aria-label]="comparisonTitle()"
  ></i>
</div>
<div class="tt-cell text-center" role="gridcell">
  <button
    type="button"
    class="btn btn-sm btn-outline-secondary"
    [attr.aria-label]="actionLabel()"
    [title]="actionLabel()"
    (click)="toggleAction()"
  >
    <i [class]="actionIcon()"></i>
  </button>
</div>
<div [class]="'tt-cell ' + targetFileClass()" role="gridcell">
  <app-tree-toggler
    [node]="node()"
    [level]="level()"
    [name]="datafile().name"
    (toggle)="toggle.emit()"
  ></app-tree-toggler
  >{{ targetFile() }}
</div>
