<div class="tt-cell" role="gridcell">
  <app-tree-toggler
    [node]="node()"
    [level]="level()"
    [name]="datafile().name"
    (toggle)="toggle.emit()"
  ></app-tree-toggler
  >{{ datafile().name }}
</div>
<div class="tt-cell text-end" role="gridcell">
  <div [hidden]="!datafile().attributes?.isFile">
    <div class="d-flex align-items-center justify-content-end gap-2 py-1">
      <span
        class="spinner-border spinner-border-sm"
        role="status"
        aria-label="loading"
        [hidden]="!spinning()"
      ></span>
      <app-select
        class="flex-grow-1"
        ariaLabel="Queue for {{ datafile().name }}"
        [options]="queues()"
        [filter]="true"
        [ngModel]="queue()"
        (ngModelChange)="queue.set($event)"
        placeholder="Select queue"
        (valueChange)="onSelectQueue()"
      ></app-select>
      <button
        class="btn btn-primary"
        type="button"
        attr.aria-label="Run {{ datafile().name }}"
        [disabled]="!computeEnabled() || !pid()"
        (click)="compute()"
      >
        <i [class]="icon_play"></i> Run
      </button>
    </div>
  </div>
</div>
