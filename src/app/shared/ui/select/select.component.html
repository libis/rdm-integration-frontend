<div class="app-select" cdkOverlayOrigin #origin="cdkOverlayOrigin">
  @if (editable()) {
    <div class="input-group">
      <input
        #trigger
        type="text"
        class="form-control"
        role="combobox"
        [attr.id]="inputId() ?? null"
        [attr.aria-label]="ariaLabel() ?? null"
        [attr.aria-expanded]="open()"
        [attr.aria-controls]="open() ? listId : null"
        [placeholder]="placeholder()"
        [disabled]="isDisabled()"
        [value]="value() ?? ''"
        (input)="onEditableInput($any($event.target).value)"
        (keydown)="onTriggerKeydown($event)"
      />
      <button
        #toggleButton
        type="button"
        class="btn btn-outline-secondary"
        aria-label="Show options"
        [attr.aria-expanded]="open()"
        [attr.aria-controls]="open() ? listId : null"
        [disabled]="isDisabled()"
        (click)="toggle()"
      >
        <i class="pi pi-chevron-down"></i>
      </button>
    </div>
  } @else {
    <button
      #trigger
      type="button"
      class="form-select text-start app-select-trigger"
      role="combobox"
      [attr.id]="inputId() ?? null"
      [attr.aria-label]="ariaLabel() ?? null"
      [attr.title]="selectedLabel() ?? null"
      [disabled]="isDisabled()"
      aria-haspopup="listbox"
      [attr.aria-expanded]="open()"
      [attr.aria-controls]="open() ? listId : null"
      (click)="toggle()"
      (keydown)="onTriggerKeydown($event)"
    >
      @if (selectedLabel(); as label) {
        {{ label }}
      } @else if (placeholder()) {
        <span class="text-body-secondary">{{ placeholder() }}</span>
      } @else {
        &nbsp;
      }
    </button>
  }
</div>

<ng-template
  cdkConnectedOverlay
  [cdkConnectedOverlayOrigin]="origin"
  [cdkConnectedOverlayOpen]="open()"
  [cdkConnectedOverlayHasBackdrop]="true"
  cdkConnectedOverlayBackdropClass="cdk-overlay-transparent-backdrop"
  [cdkConnectedOverlayMatchWidth]="true"
  (backdropClick)="close()"
  (detach)="close()"
>
  <div
    #panel
    class="app-select-panel dropdown-menu show position-static shadow"
    tabindex="-1"
    (keydown)="onPanelKeydown($event)"
    (focusout)="onPanelFocusout($event)"
  >
    @if (filter()) {
      <div class="px-2 pb-2">
        <input
          #filterInput
          type="text"
          class="form-control form-control-sm"
          placeholder="Filter"
          aria-label="Filter options"
          [attr.aria-controls]="listId"
          [value]="filterText()"
          (input)="onFilterInput($any($event.target).value)"
        />
      </div>
    }
    <ul
      #list
      class="list-unstyled mb-0 app-select-list"
      cdkListbox
      cdkListboxUseActiveDescendant
      [id]="listId"
      [attr.aria-label]="listLabel()"
      [cdkListboxValue]="listValue()"
      (cdkListboxValueChange)="onListChange($event)"
      (focus)="onListFocus()"
    >
      @for (option of visibleOptions(); track option.value) {
        <li
          class="dropdown-item app-select-option"
          [cdkOption]="option.value"
          [cdkOptionDisabled]="option.disabled ?? false"
          [cdkOptionTypeaheadLabel]="optionLabel(option)"
          [title]="option.title ?? ''"
          (click)="onOptionClick(option)"
        >
          @if (optionTemplate(); as tpl) {
            <ng-container
              *ngTemplateOutlet="tpl.template; context: { $implicit: option }"
            ></ng-container>
          } @else {
            {{ optionLabel(option) }}
          }
        </li>
      }
    </ul>
    @if (visibleOptions().length === 0) {
      <div class="dropdown-item disabled app-select-empty">No results</div>
    }
  </div>
</ng-template>
