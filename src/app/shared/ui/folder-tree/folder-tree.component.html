@if (loading()) {
  <span
    class="spinner-border spinner-border-sm"
    role="status"
    aria-label="Loading"
  ></span>
}
<cdk-tree
  #tree
  class="folder-tree"
  [attr.aria-labelledby]="ariaLabelledby() ?? null"
  [dataSource]="nodes()"
  [childrenAccessor]="children"
  [expansionKey]="nodeKey"
  [trackBy]="trackNode"
>
  <!-- A click on the toggle or the label focuses the node itself, so the arrow
    keys work right after it. The node is named after its folder alone, not
    after its content, which includes the toggle's name. -->
  <cdk-tree-node
    #treeNode
    *cdkTreeNodeDef="let node"
    class="folder-node"
    [class.selected]="isSelected(node)"
    [attr.aria-selected]="isSelected(node)"
    [attr.aria-label]="node.label"
    [isExpandable]="isExpandable(node)"
    cdkTreeNodePadding
    [cdkTreeNodePaddingIndent]="16"
    (keydown)="onKeydown($event, node, treeNode)"
    (click)="treeNode.focus()"
  >
    @if (isExpandable(node)) {
      <!-- A pointer target only: the node exposes the expansion state and
        takes the arrow keys. -->
      <button
        type="button"
        class="btn btn-link btn-sm p-0 folder-toggle"
        tabindex="-1"
        aria-hidden="true"
        (click)="toggle(node)"
      >
        <i
          class="pi"
          [class.pi-chevron-down]="tree.isExpanded(node)"
          [class.pi-chevron-right]="!tree.isExpanded(node)"
        ></i>
      </button>
    } @else {
      <span class="folder-toggle"></span>
    }
    <span class="folder-label" (click)="select(node)">{{ node.label }}</span>
  </cdk-tree-node>
</cdk-tree>
